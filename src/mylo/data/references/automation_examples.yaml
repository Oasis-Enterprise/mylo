# Home Assistant automation examples — well-formed YAML shapes that
# Mylo uses as few-shot context when the user asks for an automation.
# Each block shows a single complete automation keyed by its intent.
# Real entity_ids are placeholders — Mylo resolves them against the
# live registry before writing.

# Time-based: turn off lights at a fixed hour.
- id: lights_off_at_bedtime
  alias: "Lights off at bedtime"
  trigger:
    - platform: time
      at: "23:00:00"
  condition: []
  action:
    - service: light.turn_off
      target:
        area_id: living_room
  mode: single

# State trigger with time condition (no motion for N minutes, only at night).
- id: kitchen_auto_off_when_unused
  alias: "Turn off kitchen when no motion for 10 min after 10pm"
  trigger:
    - platform: state
      entity_id: binary_sensor.kitchen_motion
      to: "off"
      for: "00:10:00"
  condition:
    - condition: time
      after: "22:00:00"
  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.kitchen_overhead
          - light.kitchen_pendant
  mode: single

# Sunset + presence (arrive home after dark → hallway light).
- id: welcome_home_after_dark
  alias: "Welcome home after dark"
  trigger:
    - platform: state
      entity_id: person.resident
      to: "home"
  condition:
    - condition: sun
      after: sunset
  action:
    - service: light.turn_on
      target:
        entity_id: light.entry_hall
      data:
        brightness_pct: 60
  mode: single

# Device-trigger pattern — prefer entity_id triggers for portability
# across devices, but Mylo must respect an existing device_trigger when
# updating an automation the user already wrote that way.
- id: doorbell_camera_snapshot
  alias: "Doorbell → camera snapshot"
  trigger:
    - platform: state
      entity_id: binary_sensor.front_doorbell
      to: "on"
  action:
    - service: camera.snapshot
      target:
        entity_id: camera.front_door
      data:
        filename: "/media/snapshots/doorbell_{{ now().isoformat() }}.jpg"
  mode: single

# Template condition — guard against running at the wrong time.
- id: dehumidifier_when_humid
  alias: "Dehumidifier on when basement humidity high"
  trigger:
    - platform: numeric_state
      entity_id: sensor.basement_humidity
      above: 65
  condition:
    - condition: template
      value_template: "{{ states('switch.dehumidifier') == 'off' }}"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.dehumidifier
  mode: single
