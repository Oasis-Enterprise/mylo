[project]
name = "mylo"
version = "1.3.1"
description = "AI agent that lives inside Home Assistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Maxwell / Oasis Enterprise LLC" },
]
keywords = ["home-assistant", "ai-agent", "llm", "claude"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

dependencies = [
    "aiohttp>=3.10",
    "anthropic>=0.40",
    "openai>=1.40",
    "pydantic>=2.8",
    "ruamel.yaml>=0.18",
    "voluptuous>=0.15",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "python-slugify>=8.0",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.110",
    "types-python-slugify",
]

[project.scripts]
mylo = "mylo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mylo"]

# Ensure the data/ directory (shipped prompts, reference YAML) is
# included in the wheel — hatchling would otherwise skip non-.py files
# under certain layouts.
[tool.hatch.build.targets.wheel.shared-data]
"src/mylo/data" = "mylo/data"

[tool.hatch.build]
include = [
    "src/mylo/**/*.py",
    "src/mylo/data/**/*",
    "src/mylo/server/static/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle + pyflakes
    "I",               # isort
    "B",               # bugbear
    "UP",              # pyupgrade
    "SIM",             # simplify
    "RUF",             # ruff-specific
    "ASYNC",           # async best practices
]
ignore = [
    "E501",            # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
files = ["src/mylo"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "ruamel.*",
    "voluptuous.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live HA container (slow)",
    "e2e: browser-driven end-to-end tests (slow)",
]
