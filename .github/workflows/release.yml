name: Release — build & push multi-arch add-on images

# Triggers on version tags: v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            build_from: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
            platform: linux/amd64
          - arch: aarch64
            build_from: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        env:
          TAG_REF: ${{ github.ref }}
        run: echo "version=${TAG_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'aarch64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
          tags: |
            ${{ env.REGISTRY }}/oasis-enterprise/${{ matrix.arch }}-addon-mylo:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/oasis-enterprise/${{ matrix.arch }}-addon-mylo:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Mylo
            org.opencontainers.image.description=AI agent for Home Assistant
            org.opencontainers.image.source=https://github.com/Oasis-Enterprise/mylo
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
